name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload prototype
        uses: actions/upload-artifact@v4
        with:
          name: simple-recorder-windows
          path: build/SimpleRecorder_artefacts/Release/Simple Recorder.exe
